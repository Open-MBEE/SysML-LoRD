name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    name: Validate, test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate the model
        run: make validate

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build the page
        run: make web
