name: Pages

# The game is static files; every push to main rebuilds them and republishes
# the site at https://lord.opensysml.org/.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; cancelling one in flight would leave the site behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the page
    # Published from Open-MBEE/SysML-LoRD; a fork would deploy under its own domain.
    if: github.repository == 'Open-MBEE/SysML-LoRD'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build the page
        run: make web

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
